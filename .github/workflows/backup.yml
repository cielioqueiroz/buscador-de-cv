# Backup diário do banco de produção (Neon, branch main) e retenção.
#
# Por que aqui: o plano do Neon guarda só 6 h de histórico e não permite
# agendar snapshots. Este job faz um pg_dump por dia e guarda 14 dias.
#
# Depois do dump, exclui as contas sem uso há 24 meses (users.last_seen_at,
# carimbado pela sessão — db/migrations/0012). Fica aqui, e não num cron à
# parte, para só rodar quando o backup do dia já está guardado: um engano na
# regra ainda tem 14 dias para ser desfeito. Tudo do usuário cai em cascata.
#
# Também apaga o que já venceu e só ocupava espaço: notas da IA com mais de
# 14 dias (o cache não as usa mais), buscas de mais de 1 dia (valem 2 h) e
# tokens de senha vencidos ou usados — é o que a política de privacidade promete.
#
# O REPOSITÓRIO É PÚBLICO: artefatos de Actions ficam baixáveis por qualquer
# conta do GitHub. Por isso o dump sai criptografado (AES-256, gpg simétrico)
# e nunca é gravado em claro fora do runner.
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   BACKUP_DATABASE_URL  connection string direta (sem -pooler) do branch main
#   BACKUP_PASSPHRASE    senha longa para criptografar; guarde fora do GitHub
# Sem eles, o job só avisa e termina.
#
# Restaurar:
#   gpg --decrypt vaga-certa-AAAA-MM-DD.dump.gpg > backup.dump
#   pg_restore --no-owner --dbname "$URL_DE_UM_BRANCH_NOVO" backup.dump
name: Backup do banco

on:
  schedule:
    - cron: "0 6 * * *" # 03h em Brasília
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Conferir secrets
        id: check
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "::warning::BACKUP_DATABASE_URL e BACKUP_PASSPHRASE não configurados; backup pulado."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # pg_dump precisa ser da mesma versão do servidor (Neon usa Postgres 18).
      - name: Instalar pg_dump 18
        if: steps.check.outputs.ready == 'true'
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18

      - name: Dump criptografado
        if: steps.check.outputs.ready == 'true'
        run: |
          set -euo pipefail
          umask 077
          file="vaga-certa-$(date -u +%F).dump.gpg"
          /usr/lib/postgresql/18/bin/pg_dump --format=custom --no-owner --no-privileges "$DATABASE_URL" \
            | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase-fd 3 --output "$file" 3<<<"$PASSPHRASE"
          test -s "$file"
          echo "FILE=$file" >> "$GITHUB_ENV"

      - name: Guardar por 14 dias
        if: steps.check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}
          retention-days: 14
          if-no-files-found: error

      - name: Apagar dados vencidos
        if: steps.check.outputs.ready == 'true'
        run: |
          set -euo pipefail
          /usr/lib/postgresql/18/bin/psql "$DATABASE_URL" --no-psqlrc --quiet --tuples-only -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          -- mesmos prazos de lib/jobs/store.ts (SCORE_TTL 14 dias; a busca vale 2 h, guardamos 1 dia de folga)
          with n as (delete from match_cache where created_at < now() - interval '14 days' returning 1)
          select 'notas da IA vencidas apagadas: ' || count(*) from n;
          with b as (delete from job_searches where created_at < now() - interval '1 day' returning 1)
          select 'buscas antigas apagadas: ' || count(*) from b;
          with t as (delete from password_reset_tokens where expires_at < now() or used_at is not null returning 1)
          select 'tokens de senha apagados: ' || count(*) from t;
          with v as (delete from verification_token where expires < now() returning 1)
          select 'tokens de verificação apagados: ' || count(*) from v;
          commit;
          SQL

      - name: Excluir contas inativas há 24 meses
        if: steps.check.outputs.ready == 'true'
        run: |
          set -euo pipefail
          /usr/lib/postgresql/18/bin/psql "$DATABASE_URL" --no-psqlrc --quiet --tuples-only -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          create temp table inativas on commit drop as
            select id, email::text as email from users
             where last_seen_at < now() - interval '24 months';
          -- o token de verificação é ligado ao e-mail, não ao id (igual a deleteAccount)
          delete from verification_token where identifier in (select email from inativas);
          with apagadas as (delete from users where id in (select id from inativas) returning 1)
          select 'contas inativas excluídas: ' || count(*) from apagadas;
          commit;
          SQL
